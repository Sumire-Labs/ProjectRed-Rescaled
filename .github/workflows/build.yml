name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Verify Scala 3.10 integration and installed distribution
        shell: pwsh
        run: ./.github/scripts/verify.ps1 -Production
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification
          path: |
            build/verification/
            run/production-smoke/logs/
            run/smoke-server/logs/
